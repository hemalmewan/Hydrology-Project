# Define the cluster of Shiny Apps
upstream shiny_cluster {
    # CRITICAL: Ensures a user stays connected to the same container
    ip_hash; 
    
    server climate_app_1:3838;
    server climate_app_2:3838;
    server climate_app_3:3838;
}

server {
    listen 80;
    server_name localhost;

    # Route for Shiny App (Load Balanced)
    location / {
        proxy_pass http://shiny_cluster; # Point to the upstream cluster
        
        # Standard Proxy Headers
        proxy_redirect off;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # Timeout settings (R apps can be slow to calculate)
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # Route for PgAdmin (Optional: access via /pgadmin/)
    # Note: PgAdmin requires extra config to work on a subpath. 
    # For simplicity, this block assumes you might use a different port or subdomain in real production.
}